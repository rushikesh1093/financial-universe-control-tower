# The medallion pipeline as a single multi-task job.
#
# Task order encodes the real data dependencies: nothing standardises before it
# has landed, nothing is scored before it is standardised, and change detection
# runs before gold so the gold change table is current.
#
# Every task takes the same snapshot_date and pipeline_run_id, so one job run
# produces one traceable, reproducible snapshot end to end.
#
# COMPUTE: this workspace accepts serverless compute only - the Jobs API rejects
# `new_cluster` with "Only serverless compute is supported in the workspace".
# Tasks therefore declare no compute at all, which is how a bundle requests
# serverless. Nothing in the pipeline needs a dedicated cluster: it is pure
# DataFrame and Delta work with no RDD, no init scripts and no extra libraries.

resources:
  jobs:
    financial_universe_pipeline:
      name: "[${bundle.target}] Financial Universe Control Tower"
      description: >-
        Ingests the FinanceDatabase instrument universe, standardises seven
        source schemas onto a canonical model, resolves entities and listings,
        scores data quality, detects snapshot-over-snapshot change, and
        publishes the gold layer.

      # {{job.start_time.iso_date}} is resolved by Databricks at run time, so a
      # scheduled run always stamps its own snapshot date. Override the
      # parameter to reprocess a historical snapshot.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: volume
          default: ${var.volume}
        - name: snapshot_date
          default: "{{job.start_time.iso_date}}"
        - name: source_root
          default: ${var.source_root}
        - name: silver_root
          default: ${var.silver_root}
        - name: gold_root
          default: ${var.gold_root}
        - name: quarantine_root
          default: ${var.quarantine_root}
        - name: source_version
          default: main
        - name: reprocess
          default: "false"

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../databricks/notebooks/00_setup.ipynb
            source: WORKSPACE

        - task_key: source_profiling
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../databricks/notebooks/01_source_profiling.ipynb
            source: WORKSPACE

        - task_key: bronze_ingestion
          depends_on: [{ task_key: source_profiling }]
          # One retry, not several: this stage reads an external landing area so
          # a transient storage error is worth one more attempt, but repeated
          # retries only multiply the wait when the cause is a code defect.
          max_retries: 1
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../databricks/notebooks/02_bronze_ingestion.ipynb
            source: WORKSPACE

        - task_key: schema_standardisation
          depends_on: [{ task_key: bronze_ingestion }]
          notebook_task:
            notebook_path: ../databricks/notebooks/03_schema_standardization.ipynb
            source: WORKSPACE

        - task_key: master_data
          depends_on: [{ task_key: schema_standardisation }]
          notebook_task:
            notebook_path: ../databricks/notebooks/04_master_data.ipynb
            source: WORKSPACE

        - task_key: data_quality
          depends_on: [{ task_key: master_data }]
          notebook_task:
            notebook_path: ../databricks/notebooks/05_data_quality.ipynb
            source: WORKSPACE

        - task_key: change_detection
          depends_on: [{ task_key: data_quality }]
          notebook_task:
            notebook_path: ../databricks/notebooks/06_change_detection.ipynb
            source: WORKSPACE

        - task_key: gold_processing
          depends_on: [{ task_key: change_detection }]
          notebook_task:
            notebook_path: ../databricks/notebooks/07_gold_processing.ipynb
            source: WORKSPACE

        - task_key: sql_views
          depends_on: [{ task_key: gold_processing }]
          notebook_task:
            notebook_path: ../databricks/notebooks/08_sql_views.ipynb
            source: WORKSPACE

      queue:
        enabled: true

      # No active schedule in dev - a development target should never start
      # ingesting on its own. The prod target unpauses it.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - srinivasraokona2444@gmail.com

targets:
  prod:
    resources:
      jobs:
        financial_universe_pipeline:
          # A schedule override must restate the whole object, not just the
          # field being changed.
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"
            timezone_id: UTC
            pause_status: UNPAUSED
